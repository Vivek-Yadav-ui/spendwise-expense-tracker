services:
  - type: web
    name: spendwise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: spendwise-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: spendwise-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: spendwise-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: spendwise-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: spendwise-db
          property: password
databases:
  - name: spendwise-db
    plan: free